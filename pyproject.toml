[project]
name = "golf-swing-pose"
version = "0.1.0"
description = "Static-image golf pose detection and joint-angle feedback."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe>=0.10.35,<0.11",
    "numpy>=1.26,<2",
    "opencv-python>=4.9,<5",
]

[project.scripts]
golf-pose = "golf_swing_pose.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golf_swing_pose"]

[dependency-groups]
dev = ["pytest>=8.0"]
